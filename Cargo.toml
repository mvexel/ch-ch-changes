[workspace]
resolver = "2"
members = [
    "crates/ch-ch-changes-core",
    "crates/ch-ch-changes-converter",
    "crates/ch-ch-changes-worker",
    "crates/ch-ch-changes-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
# Shared versions for consistency
anyhow = "1.0"
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Arrow 54.x to match DuckDB and avoid duplicate compilation
arrow = "54.3"
parquet = "54.3"
duckdb = { version = "1.1", features = ["bundled"] }
clap = { version = "4.5", features = ["derive", "env"] }
quick-xml = "0.36"
bzip2 = "0.6"
flate2 = "1.0"
# Reqwest with only rustls (no native-tls) to reduce build size
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "form"] }
r2d2 = "0.8"
axum = "0.8"
# Tokio with only needed features (not "full") to reduce build size
tokio = { version = "1", features = ["rt-multi-thread", "net", "sync", "time", "macros"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
notify = { version = "6.1", default-features = false, features = ["macos_kqueue"] }
moka = { version = "0.12", features = ["future"] }
tokio-stream = "0.1"
async-stream = "0.3"
futures-core = "0.3"
hex = "0.4"
rand = "0.8"
sha2 = "0.10"
tokio-rusqlite = "0.7"
url = "2.5"
tempfile = "3.10"
# OpenAPI support
utoipa = { version = "5.3", features = ["axum_extras", "chrono"] }
utoipa-swagger-ui = { version = "9.0", features = ["axum"] }
