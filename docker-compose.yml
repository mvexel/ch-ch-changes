version: '3.8'

# IMPORTANT: Services require data before they can start.
# See scripts/docker/README.md for initial data setup instructions.

services:
  server:
    build: .
    image: chch:latest
    container_name: chch-server
    command: ch_ch_changes.server.app
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - ${DATA_PATH:-./data}:/data:ro  # Read-only - server doesn't write
    environment:
      - DATA_PATH=/data
      - HOST=0.0.0.0
      - PORT=3000
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - REQUIRE_AUTH=${REQUIRE_AUTH:-false}
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  worker:
    build: .
    image: chch:latest
    container_name: chch-worker
    command: ch_ch_changes.worker.main
    volumes:
      - ${DATA_PATH:-./data}:/data  # Read-write - worker writes new data
    environment:
      - DATA_PATH=/data
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - POLL_INTERVAL_SECONDS=${POLL_INTERVAL_SECONDS:-60}
      - MAX_SEQUENCES_PER_RUN=${MAX_SEQUENCES_PER_RUN:-1000}
      - HOURLY_BATCHING=${HOURLY_BATCHING:-true}
      - ENABLE_COMPACTION=${ENABLE_COMPACTION:-true}
      - COMPACTION_AGE_HOURS=${COMPACTION_AGE_HOURS:-24}
    restart: unless-stopped
    depends_on:
      - server
