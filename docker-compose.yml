version: '3.8'

# IMPORTANT: Services require data before they can start.
# See scripts/docker/README.md for initial data setup instructions.

services:
  server:
    build: .
    image: chch:latest
    container_name: chch-server
    command: chchchanges.server.app
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - ${DATA_PATH:-./data}:/data:ro # Read-only - server doesn't write
    env_file:
      - .env
    environment:
      - DATA_PATH=/data
      - HOST=0.0.0.0
      - PORT=3000
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - REQUIRE_AUTH=${REQUIRE_AUTH:-false}
      # Auth - not implemented yet
      # - OSM_OAUTH_CLIENT_ID
      # - OSM_OAUTH_CLIENT_SECRET
      # - OSM_OAUTH_REDIRECT_URL
      # - AUTH_KEY_SECRET
      # - AUTH_DB_PATH
      # - AUTH_DEFAULT_DAILY_LIMIT
      # - AUTH_DEFAULT_MONTHLY_LIMIT
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  worker:
    build: .
    image: chch:latest
    container_name: chch-worker
    command: chchchanges.worker.main
    volumes:
      - ${DATA_PATH:-./data}:/data # Read-write - worker writes new data
    env_file:
      - .env
    environment:
      - DATA_PATH=/data
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    restart: unless-stopped
    depends_on:
      - server
