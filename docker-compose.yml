version: '3.8'

services:
  api:
    image: registry.osm.lol/changeset-api:latest
    container_name: changeset-api
    restart: unless-stopped
    environment:
      - DATA_PATH=/data/changesets
      - RUST_LOG=info
    volumes:
      - changeset-data:/data
    networks:
      - changeset-network
    expose:
      - "3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 512M

  caddy:
    image: caddy:2-alpine
    container_name: changeset-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - changeset-network
    depends_on:
      - api

  builder:
    image: registry.osm.lol/changeset-builder:latest
    container_name: changeset-builder
    environment:
      - DATA_PATH=/data/changesets
    volumes:
      - changeset-data:/data
    networks:
      - changeset-network
    profiles:
      - manual

  registry:
    image: registry:2
    container_name: changeset-registry
    restart: unless-stopped
    volumes:
      - registry-data:/var/lib/registry
    networks:
      - changeset-network
    expose:
      - "5000"

volumes:
  changeset-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/changeset-data
  caddy-data:
  caddy-config:
  registry-data:

networks:
  changeset-network:
    driver: bridge
