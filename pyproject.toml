[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ch-ch-changes"
version = "0.1.0"
description = "OSM changeset API backed by DuckDB/Parquet"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "duckdb>=1.1",
    "pyarrow>=17",
    "lxml>=5",
    "httpx>=0.27",
    "pydantic-settings>=2",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx",
    "ruff>=0.6",
    "coverage>=7",
]

[project.scripts]
chch-server = "ch_ch_changes.server.app:main"
chch-worker = "ch_ch_changes.worker.main:main"
chch-convert = "ch_ch_changes.converter.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ch_ch_changes"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
