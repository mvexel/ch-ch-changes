[package]
name = "chch-convert"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "chch-convert"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
chrono = "0.4"
serde_json = "1.0"
arrow = "54.3"
parquet = "54.3"
clap = { version = "4.5", features = ["derive", "env"] }
quick-xml = "0.36"
bzip2 = "0.6"
