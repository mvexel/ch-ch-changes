# Rust converter only (for bulk planet dump imports)
# The server and worker are now Python (see pyproject.toml)

[workspace]
resolver = "2"
members = [
    "crates/ch-ch-changes-core",
    "crates/ch-ch-changes-converter",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
anyhow = "1.0"
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
arrow = "54.3"
parquet = "54.3"
clap = { version = "4.5", features = ["derive", "env"] }
quick-xml = "0.36"
bzip2 = "0.6"
flate2 = "1.0"

[[bin]]
name = "chch-convert"
path = "crates/ch-ch-changes-converter/src/main.rs"
