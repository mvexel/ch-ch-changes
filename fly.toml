# fly.toml app configuration file generated for changeset-api on 2026-01-11T14:41:57-07:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'changeset-api'
primary_region = 'iad'

[build]

[env]
  DATA_PATH = '/data/changesets'

[[mounts]]
  source = 'changeset_data'
  destination = '/data'
  initial_size = '100GB'

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  memory = '2gb'
  cpus = 2
  memory_mb = 2048
